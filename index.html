<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa para mi amor</title>
    <style>
        :root {
            --font-main: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', 'Arial Rounded MT Bold', 'Trebuchet MS', 'Lucida Handwriting', cursive, sans-serif;
        }
        body {
            font-family: var(--font-main);
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.2) 8%, transparent 18%),
                radial-gradient(circle at 80% 10%, rgba(255, 221, 129, 0.55) 0%, transparent 22%),
                linear-gradient(135deg, #0b0f2d 0%, #1a1d4d 25%, #261a46 50%, #0d153a 100%);
            color: #f7d7e8;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .stars {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            top: -10vh;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 16px rgba(255, 220, 110, 0.9);
            opacity: 0.9;
            animation: fallDiagonal linear infinite;
        }

        @keyframes fallDiagonal {
            0% {
                transform: translate3d(0, 0, 0) scale(0.7);
                opacity: 0;
            }
            12% {
                opacity: 1;
            }
            100% {
                transform: translate3d(45vw, 110vh, 0) scale(1.3);
                opacity: 0;
            }
        }

        .pantalla {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            padding: 24px 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        #pantalla3 {
            position: relative;
            min-height: 100vh;
            justify-content: center;
            overflow: visible;
        }
        .activa {
            display: flex;
        }
        h1, h2 {
            font-family: var(--font-main);
            color: #fff2fb;
            line-height: 1.2;
            margin: 0 0 12px;
            text-align: center;
            text-shadow: 0 0 16px rgba(255, 184, 214, 0.9),
                         0 3px 0 rgba(172, 90, 150, 0.9);
            -webkit-text-stroke: 0.6px rgba(159, 72, 134, 0.7);
        }
        h1 {
            font-size: clamp(2rem, 3vw, 3.2rem);
            width: 100%;
        }
        h2 {
            font-size: clamp(1.5rem, 2.3vw, 2.4rem);
            width: 100%;
        }
        p {
            font-family: var(--font-main);
            margin: 0 0 18px;
            font-size: clamp(0.95rem, 1.6vw, 1.1rem);
            color: #f9d9ea;
            text-align: center;
        }
        input {
            font-family: var(--font-main);
            width: min(90vw, 320px);
            padding: 14px 18px;
            font-size: 18px;
            border-radius: 16px;
            border: 2px solid rgba(255, 212, 228, 0.9);
            background: rgba(255,255,255,0.18);
            color: #fff7fb;
            backdrop-filter: blur(6px);
            margin-bottom: 15px;
            text-align: center;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28),
                        0 10px 24px rgba(255, 122, 190, 0.18);
            outline: none;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: rgba(255, 245, 250, 0.8);
        }

        input:focus {
            border-color: rgba(255, 171, 216, 1);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35),
                        0 0 0 4px rgba(255, 121, 186, 0.22),
                        0 12px 24px rgba(255, 122, 190, 0.2);
            background: rgba(255,255,255,0.22);
        }
        button {
            font-family: var(--font-main);
            padding: 12px 22px;
            font-size: 18px;
            background: linear-gradient(135deg, #ff72be 0%, #ff4fa2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(255, 79, 162, 0.35);
            transition: 0.3s ease;
            min-width: 150px;
        }
        button:hover {
            background-color: #ff1493;
        }
        /* Estilos del Girasol */
        .contenedor-flor {
            position: relative;
            margin: 18px 0 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            height: clamp(240px, 42vh, 520px);
            overflow: visible;
        }
        .girasol {
            font-size: 100px;
            line-height: 1;
            position: relative;
            z-index: 1;
            transition: font-size 1.8s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 1.2s ease,
                        transform 1.2s ease,
                        opacity 0.8s ease;
            will-change: font-size, transform, filter;
            user-select: none;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9))
                    drop-shadow(0 0 25px rgba(255, 165, 0, 0.8));
            animation: brilloGirasol 2.6s ease-in-out infinite alternate,
                       flotar 4.5s ease-in-out infinite;
        }
        @keyframes brilloGirasol {
            0% {
                filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.7))
                        drop-shadow(0 0 26px rgba(255, 165, 0, 0.75))
                        drop-shadow(0 0 40px rgba(255, 200, 87, 0.55));
                transform: scale(0.98);
            }
            100% {
                filter: drop-shadow(0 0 20px rgba(255, 240, 140, 0.95))
                        drop-shadow(0 0 38px rgba(255, 185, 0, 0.9))
                        drop-shadow(0 0 65px rgba(255, 214, 102, 0.7));
                transform: scale(1.04);
            }
        }
        @keyframes flotar {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        /* Escena dentro de la semilla */
        .centro-flor {
            display: none;
            position: absolute;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -50%);
            width: min(78vw, 420px);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 22px rgba(255, 182, 193, 0.9), 0 0 40px rgba(255, 191, 0, 0.4);
            text-align: center;
            z-index: 10;
            animation: aparecerVentana 0.7s ease-out;
        }
        .centro-flor h2 {
            color: #7a2d5c;
            text-shadow: none;
            -webkit-text-stroke: 0;
            margin-bottom: 18px;
        }
        .centro-flor button {
            background: linear-gradient(135deg, #ff7cc5 0%, #ff4da3 100%);
            box-shadow: 0 10px 20px rgba(255, 100, 180, 0.35);
        }
        @keyframes aparecerVentana {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .final-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: min(88vw, 560px);
            margin: 0 auto;
            padding: 18px 0 12px;
            position: relative;
            z-index: 6;
        }

        .foto-final {
            width: min(72vw, 420px);
            max-width: 420px;
            min-width: 220px;
            height: auto;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            display: block;
            margin: 0;
            padding: 12px;
            border-radius: 28px;
            background: linear-gradient(135deg, #fff5fb 0%, #ffd0e8 30%, #f5c7ff 100%);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.8),
                        0 0 0 12px rgba(255, 192, 222, 0.7),
                        0 25px 55px rgba(255, 145, 188, 0.5),
                        0 0 25px rgba(255, 228, 120, 0.45);
            border: 3px solid rgba(255,255,255,0.82);
            transform: rotate(-1.5deg);
        }

        #mensajeFinal {
            font-family: var(--font-main);
            margin: 0;
            color: #fff3fb;
            font-size: clamp(1.8rem, 3vw, 3rem);
            line-height: 1.1;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 0 18px rgba(255, 182, 214, 0.95),
                         0 3px 0 rgba(172, 90, 150, 0.9);
            -webkit-text-stroke: 0.6px rgba(159, 72, 134, 0.7);
            max-width: 520px;
            white-space: normal;
        }

        #zonaPreguntas {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(90vw, 620px);
            margin-top: 10px;
            position: relative;
            z-index: 20;
            isolation: isolate;
        }

        #textoPregunta {
            font-family: var(--font-main);
            margin: 0 0 12px;
            color: #fff7ff;
            text-align: center;
            font-size: clamp(1.3rem, 2vw, 2rem);
            line-height: 1.3;
            font-weight: 800;
            letter-spacing: 0.2px;
            text-shadow: 0 0 16px rgba(255, 184, 214, 0.9),
                         0 3px 0 rgba(172, 90, 150, 0.8);
            -webkit-text-stroke: 0.5px rgba(160, 80, 136, 0.7);
            max-width: 100%;
            position: relative;
            z-index: 21;
        }

        #zonaPreguntas input,
        #zonaPreguntas button {
            width: min(82vw, 420px);
        }

        #respuestaInput {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255, 214, 232, 0.95);
            color: #fff9fd;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 0;
                overflow-x: hidden;
            }

            .star {
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.75),
                            0 0 9px rgba(255, 220, 110, 0.65);
                animation-duration: 14s;
            }

            .pantalla {
                padding: 18px 14px;
            }

            .contenedor-flor {
                max-width: 100%;
                height: clamp(220px, 42vh, 340px);
                margin: 10px 0;
                overflow: visible;
            }

            h1, h2 {
                font-size: 1.45rem;
            }

            p {
                font-size: 0.9rem;
            }

            #textoPregunta {
                font-size: 1.1rem;
            }

            input, button {
                width: min(82vw, 300px);
                font-size: 1rem;
            }

            .centro-flor {
                width: min(78vw, 320px);
                padding: 16px;
                top: 50%;
            }

            .final-content {
                gap: 12px;
                width: min(88vw, 420px);
                padding-top: 10px;
                transform: translateY(-10vh);
            }

            .foto-final {
                width: min(82vw, 330px);
                max-width: 330px;
                border-radius: 18px;
                box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.78),
                            0 0 0 8px rgba(255, 192, 222, 0.58),
                            0 16px 30px rgba(255, 145, 188, 0.38);
            }

            #mensajeFinal {
                font-size: clamp(1.5rem, 7vw, 2.2rem);
                line-height: 1.15;
            }

            .girasol {
                font-size: 150px !important;
                filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.7));
                animation: none;
                transform: scale(var(--escala-flor, 1));
                transform-origin: center center;
                transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1),
                            opacity 0.5s ease;
                will-change: transform;
            }

            .centro-flor {
                backdrop-filter: none;
            }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <!-- PANTALLA 1: Contraseña -->
    <div id="pantalla1" class="pantalla activa">
        <h1>¿Cuál es el día de nuestro aniversario?</h1>
        <p>(Escríbelo en números, ej: 10 o 2)</p>
        <input type="text" id="passInput" placeholder="Tu respuesta">
        <button onclick="verificarPass()">Entrar</button>
    </div>

    <!-- PANTALLA 2: Aparece el girasol -->
    <div id="pantalla2" class="pantalla">
        <div class="contenedor-flor">
            <div id="miGirasol" class="girasol">🌻</div>
        </div>
        <h2>Eres mi novia hermosa</h2>
        <button onclick="irAPantalla3()">Next ➔</button>
    </div>

    <!-- PANTALLA 3: Preguntas para crecer -->
    <div id="pantalla3" class="pantalla">
        <h1>Tienes que hacer crecer el girasol este es mi corazon 🌧️</h1>
        
        <div class="contenedor-flor">
            <div id="girasolCreciendo" class="girasol">🌻</div>
            
            <!-- Escena final dentro del girasol gigante -->
            <div id="escenaCentro" class="centro-flor">
                <h2>¿Quieres saber que siente tu novio por ti? 🧸</h2>
                <button id="botonMagico" onclick="clickMagico()">Siguiente</button>
            </div>
        </div>

        <div id="zonaPreguntas">
            <h3 id="textoPregunta">Pregunta 1: ¿Cuál es mi comida favorita?</h3>
            <input type="text" id="respuestaInput" placeholder="Respuesta">
            <button onclick="verificarPregunta()">Responder</button>
        </div>
        
        <!-- Elementos finales (Foto y Audio) -->
        <div id="finalContent" class="final-content">
            <img id="fotoAmor" class="foto-final" src="foto.jpg" alt="Mi hermosa novia">
            <h2 id="mensajeFinal">¡FELIZ ANIVERSARIO Y FLORES AMARILLAS!</h2>
        </div>
        <audio id="cancionAmor" src="cancion.mp3"></audio>
    </div>

    <script>
        const starsContainer = document.getElementById("stars");
        const cantidadEstrellas = window.matchMedia("(max-width: 600px)").matches ? 14 : 42;
        for (let i = 0; i < cantidadEstrellas; i++) {
            const star = document.createElement("span");
            star.className = "star";
            const size = Math.random() * 4 + 2;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDelay = `${(Math.random() * 6).toFixed(2)}s`;
            star.style.animationDuration = `${Math.random() * 6 + 8}s`;
            star.style.opacity = (Math.random() * 0.7 + 0.3).toFixed(2);
            starsContainer.appendChild(star);
        }

        // --- AQUÍ CAMBIAS LAS RESPUESTAS CORRECTAS ---
        const passwordCorrecta = "15"; // Cambia por el día de su aniversario
        const respuestasValidasPassword = new Set(["18", "18/01", "18-01", "18 01"]);
        const respuesta1 = "medellin";    // Respuesta pregunta 1 (escríbela en minúsculas)
        const respuesta2 = "amarillo";     // Respuesta pregunta 2
        const respuesta3 = "sapito";    // Respuesta pregunta 3
        
        const preguntas = [
            "Pregunta 1: ¿Donde estaba tu novio antes de conocerte 🤔?",
            "Pregunta 2: ¿Cuál es el color favorito de tu novio?",
            "Pregunta 3: ¿Cuál es la posicion favorita donde se siente mas rico 🔥?"
        ];
        
        let nivelActual = 0;
        let clicsFinales = 0;

        function verificarPass() {
            let pass = document.getElementById("passInput").value.trim().toLowerCase();
            let passNormalizada = pass.replace(/\s+/g, "").replace(/-/g, "/");
            let esCorrecta = pass === passwordCorrecta ||
                passNormalizada === passwordCorrecta ||
                passNormalizada === "18/01" ||
                respuestasValidasPassword.has(passNormalizada);

            if (esCorrecta) {
                document.getElementById("pantalla1").classList.remove("activa");
                document.getElementById("pantalla2").classList.add("activa");
            } else {
                alert("Uy, intenta de nuevo mi amor ❤️");
            }
        }

        function irAPantalla3() {
            document.getElementById("pantalla2").classList.remove("activa");
            document.getElementById("pantalla3").classList.add("activa");
            document.getElementById("textoPregunta").innerText = preguntas[0];
            document.getElementById("girasolCreciendo").style.fontSize = "150px"; // tamaño inicial elegante
        }

        function normalizarRespuesta(valor) {
            return valor
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, " ");
        }

        function verificarPregunta() {
            let res = normalizarRespuesta(document.getElementById("respuestaInput").value);
            let respuestas = [respuesta1, respuesta2, respuesta3].map(normalizarRespuesta);
            let girasol = document.getElementById("girasolCreciendo");
            
            if(nivelActual === 0 && res === respuestas[0]) {
                nivelActual++;
                girasol.style.fontSize = "250px";
                girasol.style.setProperty("--escala-flor", "1.67");
                document.getElementById("textoPregunta").innerText = preguntas[1];
                document.getElementById("respuestaInput").value = "";
            } 
            else if(nivelActual === 1 && res === respuestas[1]) {
                nivelActual++;
                girasol.style.fontSize = "420px";
                girasol.style.setProperty("--escala-flor", "2.8");
                document.getElementById("textoPregunta").innerText = preguntas[2];
                document.getElementById("respuestaInput").value = "";
            }
            else if(nivelActual === 2 && res === respuestas[2]) {
                girasol.style.fontSize = "650px";
                girasol.style.setProperty("--escala-flor", "4.33");
                document.getElementById("zonaPreguntas").style.display = "none";
                
                setTimeout(() => {
                    document.getElementById("escenaCentro").style.display = "block";
                }, 1000);
            } else {
                alert("Esa no es, piénsalo bien amor 🥰");
            }
        }

        function clickMagico() {
            let boton = document.getElementById("botonMagico");
            clicsFinales++;
            
            if(clicsFinales === 1) {
                boton.innerText = "¿Segura que quieres?";
            } 
            else if(clicsFinales === 2) {
                boton.innerText = "Tú lo pediste...";
            } 
            else if(clicsFinales === 3) {
                document.getElementById("escenaCentro").style.display = "none";
                document.getElementById("girasolCreciendo").style.display = "none";
                document.getElementById("zonaPreguntas").style.display = "none";
                document.querySelector("#pantalla3 h1").style.display = "none";
                document.getElementById("finalContent").style.display = "flex";
                document.getElementById("cancionAmor").play();
            }
        }
    </script>
</body>
</html>
